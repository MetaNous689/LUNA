[package]
name = "luna"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Luna — a premium terminal system monitor for Linux with Claude Code and Codex agent status"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MetaNous689/LUNA"
keywords = ["monitor", "tui", "system", "claude-code", "codex"]
categories = ["command-line-utilities"]

[[bin]]
name = "luna-monitor"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "parsing"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
